# Copy to .github/workflows/tests.yml to enable on GitHub.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check the Bash installer
        shell: bash
        run: bash -n install.sh
      - name: Run tests using isolated Claude configuration
        run: python -m unittest discover -s tests -v
